<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./imagens/medicine.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400..900&family=Cormorant:ital,wght@0,300..700;1,300..700&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Righteous&family=Sarala:wght@400;700&family=Sora:wght@100..800&family=Teko:wght@300..700&display=swap"
        rel="stylesheet">

    <title>Guilda dos Alquimistas</title>
</head>

<body>

    <div class="pergaminho">
        <header>
            <h1>Guilda dos Alquimistas</h1>

            <p>Registro Oficial de Alquimistas</p>
        </header>

        <main>

            <div class="card-cadastro">
                <section>
                    <h2>Novo Alquimista</h2>

                    <form id="formAlquimista">

                        <label for="nome">Nome:</label>
                        <input id="nome" name="nome" type="text" placeholder="Ex: Merlin" required>

                        <label for="email">Email:</label>
                        <input id="email" name="email" type="email" placeholder="merlin@exemplo.com" required>

                        <button type="submit">Registrar Alquimista</button>

                    </form>

                </section>
            </div>

            <div class="card-registro">
                <section>
                    <h2>Alquimistas Registrados</h2>

                    <ul id="alquimistasRegistrados"></ul>
                </section>
            </div>

        </main>

    </div>

    <footer>
        <p>Que seus experimentos jamais explodam.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
